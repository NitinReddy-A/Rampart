name: CI

# Build + test Rampart on every push and PR.
# Rampart's core is dependency-free stdlib Python, so CI stays fast and simple.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ruff (hash-pinned)
        run: python -m pip install --require-hashes -r requirements/ci.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tooling (hash-pinned) and the package
        # Every dependency comes from the hash-locked requirements/ci.txt; the package itself has
        # none (--no-deps) and is built with the pinned setuptools (--no-build-isolation).
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Run tests
        run: python -m pytest -q

      - name: Run reliability benchmark
        # Exits nonzero on any false positive / false negative, gating the build.
        run: python benchmarks/run_benchmark.py

  fuzz:
    # Coverage-guided fuzzing (Atheris / libFuzzer) of the parsers on Rampart's trust boundary:
    # the scope contract that gates every scan, and the SARIF locations code scanning ingests.
    # A crash or a broken invariant fails the job and prints the reproducing input.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Atheris (hash-pinned) and the package
        run: |
          python -m pip install --require-hashes -r requirements/fuzz.txt
          python -m pip install --require-hashes -r requirements/build.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Fuzz
        # The seeds include past finds, so each run re-checks them first.
        run: |
          mkdir -p "$RUNNER_TEMP/fuzz-crashes"
          for target in fuzz/fuzz_*.py; do
            name="$(basename "$target" .py)"
            corpus="$RUNNER_TEMP/corpus/$name"
            mkdir -p "$corpus"
            cp fuzz/seeds/"${name#fuzz_}"/* "$corpus"/
            echo "::group::$name"
            python "$target" -max_total_time=60 -timeout=10 -rss_limit_mb=2048 \
              -artifact_prefix="$RUNNER_TEMP/fuzz-crashes/$name-" "$corpus"
            echo "::endgroup::"
          done
      - name: Keep the reproducing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: ${{ runner.temp }}/fuzz-crashes/

  docker:
    # Build the release image on every push so a broken Dockerfile is caught here, not at release time.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: rampart:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test image
        run: |
          docker run --rm rampart:ci --version
          docker run --rm -v "$PWD/examples:/work/examples:ro" rampart:ci \
            init --scope-file examples/demo_target/rampart.scope.yaml
