# External-corpus scoring — runs Rampart against OWASP VAmPI (Dockerised) and scores precision/recall.
# VAmPI has a vulnerable/secure switch (like Rampart's own demo), so it is ideal for CI scoring.
# Manual/scheduled (not on every push) since it pulls an image and runs a live assessment.

name: Corpus (VAmPI)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"   # weekly

permissions:
  contents: read

jobs:
  vampi:
    runs-on: ubuntu-latest
    services:
      vampi:
        image: erev0s/vampi:latest
        ports:
          - 5000:5000
        env:
          vulnerable: "1"
          tokentimetolive: "600" # VAmPI's default 60s token can expire mid-scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Rampart (hash-pinned build tooling, no dependencies)
        run: |
          python -m pip install --require-hashes -r requirements/build.txt
          python -m pip install --no-deps --no-build-isolation -e .
      # VAmPI starts with an empty database and random book titles: populate it, seed one known
      # book per test account, and save the live spec + test-account secrets outside the workspace.
      - name: Prepare VAmPI
        run: python benchmarks/vampi_setup.py --target http://127.0.0.1:5000 --out-dir "$RUNNER_TEMP/vampi"
      - name: Score Rampart against VAmPI
        run: |
          python benchmarks/corpus_runner.py \
            --target http://127.0.0.1:5000 \
            --scope-file benchmarks/fixtures/vampi-rampart.scope.yaml \
            --ground-truth benchmarks/fixtures/vampi-ground-truth.json \
            --openapi "$RUNNER_TEMP/vampi/vampi-openapi.json" \
            --appmodel-seed benchmarks/fixtures/vampi-appmodel-seed.json \
            --secrets "$RUNNER_TEMP/vampi/vampi-secrets.json" \
            --login-path /users/v1/login --token-path auth_token \
            --crawl --active --min-recall 0.5 --out .rampart-corpus/vampi-report.json
      - name: Upload corpus report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vampi-corpus
          path: .rampart-corpus/
