<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 104" width="96" height="104" role="img" aria-label="Rampart logo">
  <title>Rampart</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#3B5BDB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="proof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <clipPath id="shield">
      <path d="M10 10H27V22H40V10H56V22H69V10H86V54C86 76 69 91 48 99C27 91 10 76 10 54Z"/>
    </clipPath>
    <style>
      .cursor { animation: blink 1.6s steps(1, end) infinite; }
      @keyframes blink { 50% { opacity: 0.25; } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
  </defs>
  <!-- the rampart: a crenellated wall that is also a shield -->
  <path d="M10 10H27V22H40V10H56V22H69V10H86V54C86 76 69 91 48 99C27 91 10 76 10 54Z"
        fill="url(#wall)" stroke="url(#wall)" stroke-width="4" stroke-linejoin="round"/>
  <rect x="0" y="0" width="96" height="104" fill="url(#sheen)" clip-path="url(#shield)"/>
  <path d="M10 10H27V22H40V10H56V22H69V10H86V54C86 76 69 91 48 99C27 91 10 76 10 54Z"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- the agent at work: a terminal prompt, and a cursor in "proven" green -->
  <path d="M31 40L45 53L31 66" fill="none" stroke="#FFFFFF" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="cursor" x="50" y="60" width="18" height="7" rx="3.5" fill="url(#proof)"/>
</svg>
